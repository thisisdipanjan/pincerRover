ydlidar_ros2_driver_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    frame_id: "laser_frame"
    ignore_array: ""
    baudrate: 128000
    lidar_type: 1               
    device_type: 0             
    isSingleChannel: true       
    intensity: false
    intensity_bit: 0
    sample_rate: 3              
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: false
    inverted: false
    auto_reconnect: true
    support_motor_dtr: true
    angle_max: 170.0
    angle_min: -170.0
    range_max: 8.0
    range_min: 0.01
    frequency: 8.0              
    invalid_range_is_inf: false
    debug: false
