ekf_filter_node:
  ros__parameters:
    frequency: 30            # EKF update rate (Hz)
    sensor_timeout: 0.1      # Timeout for sensors

    two_d_mode: true         # If your robot moves mostly in 2D
    publish_tf: true         # Publish base_link → odom TF


    imu0: /imu/raw
    imu0_config: [false, false, false,   # x, y, z position
                  false, false, true,    # roll, pitch, yaw orientation (use yaw)
                  true, true, true,       # angular velocities x,y,z
                  true, true, true]       # linear acceleration x,y,z
    imu0_differential: false
    imu0_queue_size: 10
    imu0_nodelay: false
    imu0_remove_gravitational_acceleration: true


    odom0: /odom_rf2o
    odom0_config: [true, true, false,    # x, y, ignore z
                   false, false, false,  # roll, pitch, yaw ignored (use imu yaw)
                   true, true, false,    # linear vel x,y, ignore z
                   false, false, false]  # angular vel only from IMU
    odom0_queue_size: 5
    odom0_differential: false
    odom0_nodelay: false

    # Process noise covariance
    process_noise_covariance: [0.05, 0, 0, 0, 0, 0,
                               0, 0.05, 0, 0, 0, 0,
                               0, 0, 0.0001, 0, 0, 0,
                               0, 0, 0, 0.0001, 0, 0,
                               0, 0, 0, 0, 0.0001, 0,
                               0, 0, 0, 0, 0, 0.01]

    # Measurement noise covariance
    imu0_covariance: [0.01, 0, 0,
                      0, 0.01, 0,
                      0, 0, 0.01]

    odom0_covariance: [0.05, 0, 0,
                       0, 0.05, 0,
                       0, 0, 0.1]

    world_frame: odom
    base_link_frame: base_link
